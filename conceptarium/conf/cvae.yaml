# =============================================================
# Train a Conditional VAE conditioned on the concepts.
#
# The baseline to run against --config-name cbgm: same datasets,
# same likelihood, same analysis. A CVAE has no concept
# bottleneck, so it should generate at least as well (nothing is
# squeezed through k contexts) and steer at least as strongly
# (the condition IS the decoder's input) -- the question the
# comparison answers is what the bottleneck costs, and what it
# buys back in concept inference, which a CVAE cannot do at all.
#
#   cd conceptarium
#   python run_experiment.py --config-name cvae -m \
#       trainer.accelerator=gpu trainer.devices=1
#
# Restrict any axis on the command line, e.g. `dataset=colormnist
# kl=10` (a single value on every axis drops -m).
#
# Then the figures and metrics, alongside the CBGM runs -- the
# analysis discovers both and averages per model:
#   python conceptarium/analysis/run_generative_analysis.py
#
# Requires `pyro-ppl` (VariationalInference), which is not in the
# conceptarium environment files.
# =============================================================
defaults:
  - _default
  - override /model: cvae
  - override /loss: cvae
  - override /dataset: colormnist
  - _self_

hydra:
  job:
    name: cvae
  sweeper:
    params:
      dataset: colormnist, celeba
      kl: 0.1, 0.3, 1.0
      model.model_cls.latent_size: 32
      model.model_cls.embedding_size: 16
      model.model_cls.condition_encoder: true

seed: 42

# Loss weights as named keys, sweepable without restating the whole
# `loss.weights` list -- e.g. `-m kl=5,10`. Order is fixed by
# conf/loss/cvae.yaml's `terms`; the numbers match its defaults.
recon: 1.0    # MSE( input, decoder(z, concepts) ), summed over pixels
# SWEPT, because 1.0 measurably is not enough. The whole reconstruction budget
# on colormnist is D*Var(x) ~ 100 nats, and a useful MNIST latent costs 15-40 --
# so at kl=1.0 the trade is break-even and the encoder declines to take it.
#
# DIAGNOSTIC: KL sitting at exactly `0.5 * latent_size` (16.0 at latent_size=32)
# means every dimension is pinned to the free-bits floor, i.e. the latent is
# carrying nothing and the decoder is working from the concepts alone. That is
# invisible in the total loss -- check `kl` in the per-term breakdown, not
# val_loss. Lower `kl` until it rises above the floor.
kl: 1.0       # KL( q(z|input,concepts) || p(z) )
# NOT the CBGM's `alpha`. This one only fits the marginal p(c) used for
# unconditional sampling; it competes with nothing (see conf/loss/cvae.yaml).
alpha: 1.0

loss:
  weights:   # block style: `[${recon}, ...]` is a YAML flow-sequence parse error
    - ${recon}
    - ${kl}
    - ${alpha}

# MUST stay false: precomputing embeddings replaces the pixels in the
# dataset with backbone features, which destroys the reconstruction
# target. The backbone still runs live, once per step, as the guide's
# shared trunk.
precompute_embeddings: False
force_precompute: False

dataset:
  datamodule:
    batch_size: 256

trainer:
  max_epochs: 50
  monitor: "val_loss"
  patience: 10
  accelerator: "auto"
  logger: null       # null / wandb
  log_model: false

  # Ramp the KL weight 0 -> `kl` over the first 5 epochs. At full strength from
  # step 0 the KL is trivially minimised by ignoring the input: the guide matches
  # the prior, z carries nothing, and the decoder settles for reproducing the
  # per-condition mean. Dimensions lost that way rarely come back, and the run
  # still reports a respectable val_loss.
  callbacks:
    - _target_: "torch_concepts.nn.LossWeightWarmup"
      term: KLDivergenceLoss
      epochs: 5

matmul_precision: medium

# false so the run is written to runs.csv.
debug: false
notes: cvae
