# =============================================================
# Train a Concept Bottleneck Generative Model.
#
# Sweeps both image datasets (colormnist, celeba) x the concept
# weight `alpha` x the KL weight -- 2*3*4 = 24 jobs -- in one multirun:
#
#   cd conceptarium
#   python run_experiment.py --config-name cbgm -m \
#       trainer.accelerator=gpu trainer.devices=1
#
# That is a lot; restrict any axis on the command line, e.g.
# `dataset=colormnist alpha=100` leaves the 4 kl values
# (a single value on every axis drops -m).
#
# Then produce the generation / steering / counterfactual figures:
#   python conceptarium/analysis/run_generative_analysis.py
#
# To ablate the unsupervised context -- the paper's Table 3 row, where removing
# it cost steerability (25.6 -> 16.5) and image quality (FID -> 44.1) -- set
# `model.model_cls.use_unknown=false`. That one flag drops the variable from the
# graph, shrinks the decoder input, and makes the orthogonality term vacuous:
#   python run_experiment.py --config-name cbgm -m dataset=colormnist \
#       alpha=50 kl=0.3 model.model_cls.use_unknown=true,false
#   python conceptarium/analysis/run_generative_analysis.py all_jobs=true
#
# CelebA has 40 concepts, hence 40 steering figures — pick a few:
#   python conceptarium/analysis/run_generative_analysis.py \
#       steer_concepts="[Smiling,Male,Eyeglasses]"
#
# Requires `pyro-ppl` (VariationalInference), which is not in the
# conceptarium environment files.
#
# Checkpoints predating the binary two-embedding fix or the Gaussian
# observation below will NOT load — those shapes changed. Retrain.
# =============================================================
defaults:
  - _default
  - override /model: cbgm
  - override /loss: cbgm
  - override /dataset: colormnist
  - _self_

hydra:
  job:
    name: cbgm
  sweeper:
    params:
      dataset: colormnist, celeba
      alpha: 50, 100
      kl: 0.1, 0.3, 1.0
      p_int: 1
      model.model_cls.use_unknown: false 
      model.model_cls.latent_size: 32
      model.model_cls.embedding_size: 8, 16

seed: 42

# Loss weights as named keys, sweepable without restating the whole
# `loss.weights` list -- e.g. `-m alpha=1,5,10 kl=0.5,1`. Order is fixed
# by conf/loss/cbgm.yaml's `terms`; the numbers match its defaults.
recon: 1.0    # MSE( input, decoder(bottleneck) ), summed over pixels
# SWEPT, because 1.0 measurably is not enough. The whole reconstruction budget
# on colormnist is D*Var(x) ~ 100 nats, and a useful MNIST latent costs 15-40 --
# so at kl=1.0 the trade is break-even and the encoder declines to take it.
#
# DIAGNOSTIC: KL sitting at exactly `0.5 * latent_size` (16.0 at latent_size=32)
# means every dimension is pinned to the free-bits floor, i.e. the latent is
# carrying nothing. That is invisible in the total loss -- check `kl` in the
# per-term breakdown, not val_loss. Lower `kl` until it rises above the floor.
#
# For reference on the scale, the CBGM paper computes
#   prior_loss = (-0.5 * sum(1 + logvar - mean^2 - exp(logvar))) / numel(mean) * 10
# i.e. it divides the KL by (batch x latent_size) before scaling, while
# KLDivergenceLoss here sums the event and averages only the batch. In this
# convention the reference's weight is 10 / latent_size = 10/32 ~= 0.31. Its
# reconstruction is also a MEAN over discriminator features, not a sum over
# pixels, so neither term is directly comparable -- treat 0.31 as a landmark to
# bracket, not a target.
#
# Note also that any recon:KL arithmetic assumes D=2352 pixels carry signal.
# On colormnist they do not: `colorize` writes the intensity into ONE RGB
# channel, so 1568 of those dims are identically zero and most of the rest are
# background. The effective ratio is milder than the arithmetic suggests.
kl: 1.0       # KL( q(z|input) || p(z) )
# Not the reference's 5.0. At a low `p_int` the concepts are mostly not
# teacher-forced, so a concept is only predictable if q(z|x) encoded it -- and it
# is RECONSTRUCTION that decides what z encodes. That term sums over D pixels, so
# it outweighed concept supervision 81:1 on the encoder at alpha=5 (measured at
# init, D=2352, and at the sigma=0.3 this config used to set).
#
# The cost falls on whichever concept contributes least to pixel MSE. On a
# colormnist-shaped toy, color (a global tint, which reconstruction encodes for
# free) held 0.999 at every setting while the 10-way digit went
#   alpha 5 -> 0.103 (chance)   100 -> 0.972   1000 -> 0.997
# Equalising the two gradients at init needed ~400 there.
#
# CAUTION: those numbers were all measured at sigma=0.3. sigma is now 1, which
# divides the reconstruction gradient by 1/0.3^2 ~= 11 and leaves concept
# supervision untouched -- so the whole useful range of `alpha` shifts DOWN by
# about that factor (the ~400 landmark becomes ~36). The values below are kept
# as-is rather than silently rescaled; re-sweep before trusting them.
alpha: 100.0  # concept supervision  (reference ALPHA)
beta: 1.0     # orthogonality        (reference BETA)

# CEM's RandInt: the per-sample, per-concept probability that the bottleneck
# mixes by the GROUND-TRUTH label instead of the model's own predicted score.
# Applied to the train engine only (conf/model/cbgm.yaml); eval stays at 0.0.
#
# This is the steerability knob. At 0.0 the decoder only ever sees scores it
# produced itself, so an intervention hands it an input distribution it was
# never trained on. At 1.0 the unselected state embedding gets EXACTLY zero
# reconstruction gradient, which is worse. In between, both are covered.
#
# conf/sweep.yaml runs the discriminative models at 0.8; start lower here,
# because CBGM also needs the unforced rows to train w-.
p_int: 0.25

loss:
  weights:   # block style: `[${recon}, ...]` is a YAML flow-sequence parse error
    - ${recon}
    - ${kl}
    - ${alpha}
    - ${beta}

# MUST stay false: precomputing embeddings replaces the pixels in the
# dataset with backbone features, which destroys the reconstruction
# target. The backbone still runs live, once per step, as the guide's
# shared trunk.
precompute_embeddings: False
force_precompute: False

dataset:
  datamodule:
    batch_size: 256

trainer:
  max_epochs: 50
  monitor: "val_loss"
  patience: 10
  accelerator: "auto"
  logger: null       # null / wandb
  log_model: false

  # Ramp the KL weight 0 -> `kl` over the first 5 epochs. At full strength from
  # step 0 the KL is trivially minimised by ignoring the input: the guide matches
  # the prior, z carries nothing, and the decoder settles on the data mean before
  # reconstruction has taught it anything. Dimensions lost that way rarely come
  # back, and the run still reports a respectable val_loss.
  callbacks:
    - _target_: "torch_concepts.nn.LossWeightWarmup"
      term: KLDivergenceLoss
      epochs: 5

matmul_precision: medium

# false so the run is written to runs.csv; run_generative_analysis.py
# discovers the trained model through that registry.
debug: false
notes: cbgm
